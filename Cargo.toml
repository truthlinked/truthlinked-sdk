[workspace]
members = [
    "truthlinked-sdk",
    "truthlinked-sdk-macros",
]
exclude = [
    "templates/rust-contract",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
blake3 = { version = "1", default-features = false }
proc-macro2 = "1.0"
quote = "1.0"
sha2 = { version = "0.10", default-features = false }
syn = { version = "2.0", features = ["full"] }
truthlinked-sdk-macros = { version = "0.1.0" }

[patch.crates-io]
truthlinked-sdk-macros = { path = "truthlinked-sdk-macros" }
